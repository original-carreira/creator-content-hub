ktor {
  deployment {
    port = 8080
    host = "0.0.0.0"
    watch = []

    connectionGroupSize = 2
    workerGroupSize = 4
    callGroupSize = 4
  }

  application {
    modules = [ com.creatorcontenthub.ApplicationKt.module ]
  }
}

database {
  url = ${?DB_URL} ?: "jdbc:postgresql://localhost:5432/creator_db"
  user = ${?DB_USER} ?: "user"
  password = ${?DB_PASSWORD} ?: "password"
}

ytDlp {
  path = ${?YTDLP_PATH}
}

whisper {
  path = ${?WHISPER_PATH}
}

app {
  outputDir = "./data"
}