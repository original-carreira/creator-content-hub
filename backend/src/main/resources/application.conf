ktor {
  deployment {
    port = 8080
    host = "0.0.0.0"
    watch = []

    connectionGroupSize = 2
    workerGroupSize = 4
    callGroupSize = 4
  }

  application {
    modules = [ com.creatorcontenthub.ApplicationKt.module ]
  }
}

database {
  url = "jdbc:postgresql://localhost:5432/creator_db"
  user = "user"
  password = "password"
}

ytDlp {
  path = ${?YTDLP_PATH}
}

whisper {
  path = ${?WHISPER_PATH}
}

app {
  outputDir = ${?OUTPUT_DIR}
}

search.rank {
  textWeight = 0.72
  timeWeight = 0.28

  maxScore = 3.0
  recencyDecay = 14.0

  statusBoost {
    DONE = 1.15
    FAILED = 0.7
    DEFAULT = 1.0
  }
}
