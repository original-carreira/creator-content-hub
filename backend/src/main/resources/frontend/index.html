<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Creator Content Hub</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
    <h1>Creator Content Hub</h1>

    <!-- INGEST -->
    <div class="ingest-box">

        <input id="urlInput" class="input-url" placeholder="Cole a URL do vídeo (YouTube)" />

        <div class="ingest-actions">

            <div class="ingest-actions-top">
                <button id="ingestBtn" class="btn-primary" onclick="ingest()">
                    Processar
                </button>

                <button class="btn-danger" onclick="stopPolling()">
                    Parar Processamento
                </button>
            </div>

            <button class="btn-secondary btn-clear-url" onclick="clearUrlInput()">
                Limpar URL
            </button>

        </div>

    </div>

    <!-- STATUS DO INGEST -->
    <div id="ingestStatus"></div>

    <!-- BUSCA -->
    <div class="search-box">

        <input
                id="searchInput"
                class="search-input"
                placeholder="Buscar vídeos, resumos ou ID..."
                oninput="onSearchInput(this.value)"
        />

        <!-- LINHA 1 -->
        <div class="row-actions">
            <button class="btn-primary action-btn" onclick="search()">Buscar</button>
            <button class="btn-secondary action-btn" onclick="loadJobs()">Jobs</button>
            <button class="btn-secondary action-btn" onclick="clearSearch()">Limpar busca</button>
        </div>

        <!-- LINHA 2 -->
        <div class="row-actions">
            <select id="statusFilter" class="control action-btn">
                <option value="">Todos</option>
                <option value="DONE">Concluído</option>
                <option value="PROCESSING">Processando</option>
                <option value="FAILED">Falhou</option>
                <option value="CANCELED">Cancelado</option>
            </select>

            <select id="sortOrder" class="control action-btn">
                <option value="desc">Mais recentes</option>
                <option value="asc">Mais antigos</option>
            </select>

            <div style="display:flex; align-items:center; gap:8px;">
                <label style="display:flex; align-items:center; gap:4px;">
                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)" />
                    Selecionar todos
                </label>

                <span id="selectedCount">0 selecionado(s)</span>
            </div>
        </div>

        <!-- LINHA 3 -->
        <div class="row-actions">
            <button class="btn-danger action-btn" onclick="deleteSelected()">Deletar</button>
            <button class="btn-danger action-btn" onclick="resetUI()">Limpar tudo</button>
        </div>



    </div>

    <!-- STATUS GERAL -->
    <div id="status"></div>

    <!-- RESULTADOS -->
    <div class="content">
        <div id="results" class="results"></div>
        <div id="details" class="details"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
