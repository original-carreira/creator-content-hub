<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Media Center</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">

    <h2>Media Center</h2>

    <div
       style="
            margin-bottom:20px;
            color:#666;
       "
    >
       Gerenciamento e Operações de Mídia
    </div>

    <div id="mediaContent">
        Carregando...
    </div>

</div>

<script src="content-workspace/state/workspaceState.js"></script>
<script src="content-workspace/renderers/videoWorkspaceRenderer.js"></script>
<script src="content-workspace/clip/clipSelectionController.js"></script>
<script src="content-workspace/clip/clipOperation.js"></script>
<script src="content-workspace/clip/operationResult.js"></script>
<script src="content-workspace/clip/clipOperationsController.js"></script>
<script src="content-workspace/media-operations/mediaOperationsController.js"></script>
<script src="content-workspace/timeline/timelineRenderer.js"></script>
<script src="content-workspace/timeline/timelineController.js"></script>
<script src="content-workspace/timeline/timelineView.js"></script>
<script src="content-workspace/timeline/timelineWorkspace.js"></script>

<script>

    function getJobId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get("jobId");
    }

    function parseTemporalInput(
        value
    ) {

        const normalizedValue =
            value.trim();

        if (
            normalizedValue === ""
        ) {
            return Number.NaN;
        }

        if (
            /^\d+$/.test(
                normalizedValue
            )
        ) {

            return Number(
                normalizedValue
            );
        }

        const parts =
            normalizedValue.split(
                ":"
            );

        if (
            parts.length !== 2 &&
            parts.length !== 3
        ) {
            return Number.NaN;
        }

        const numericParts =
            parts.map(
                part => Number(part)
            );

        if (
            numericParts.some(
                Number.isNaN
            )
        ) {
            return Number.NaN;
        }

        if (
            parts.length === 2
        ) {

            const [
                minutes,
                seconds
            ] = numericParts;

            return (
                minutes * 60 +
                seconds
            );
        }

        const [
            hours,
            minutes,
            seconds
        ] = numericParts;

        return (
            hours * 3600 +
            minutes * 60 +
            seconds
        );
    }

    function formatVideoTime(
        totalSeconds
    ) {

        if (
            totalSeconds === null ||
            Number.isNaN(totalSeconds)
        ) {
            return "--";
        }

        const seconds =
            Math.floor(totalSeconds);

        const hours =
            Math.floor(
                seconds / 3600
            );

        const minutes =
            Math.floor(
                (seconds % 3600) / 60
            );

        const remainingSeconds =
            seconds % 60;

        return [
            hours,
            minutes,
            remainingSeconds
        ]
            .map(
                value =>
                    String(value)
                        .padStart(
                            2,
                            "0"
                        )
            )
            .join(":");
    }

    async function loadJob() {

        const jobId =
            getJobId();

        if (!jobId) {

            document.getElementById(
                "mediaContent"
            ).innerText =
                "Job inválido";

            return;
        }

        try {

            const response =
                await fetch(
                    `/jobs/${jobId}/assets`
                );

            const payload =
                await response.json();

            const assets =
                payload.data;

            renderMediaCenter(
                assets
            );

        } catch (error) {

            console.error(
                "[MEDIA CENTER LOAD ERROR]",
                error
            );

            document.getElementById(
                "mediaContent"
            ).innerText =
                "Erro ao carregar Media Center";
        }
    }

    function renderMediaCenter(
        assets
    ) {

        /*
         * ============================================================
         * FASE 1
         * Renderização do Media Workspace
         * ============================================================
         */

        document.getElementById(
            "mediaContent"
        ).innerHTML =
            window.VideoWorkspaceRenderer
                .renderVideoWorkspace(
                    assets
                );

        /*
         * ============================================================
         * FASE 2
         * Resolução das referências do DOM
         *
         * Nesta fase nenhum comportamento é executado.
         * Apenas são resolvidas todas as referências
         * necessárias para as fases seguintes.
         * ============================================================
         */

        const videoElement =
            document.querySelector(
                "video"
            );

        const markInButton =
            document.getElementById(
                "clipMarkInButton"
            );

        const markOutButton =
            document.getElementById(
                "clipMarkOutButton"
            );

        const clearSelectionButton =
            document.getElementById(
                "clipClearSelectionButton"
            );

        const durationDisplay =
            document.getElementById(
                "videoDurationDisplay"
            );

        const currentTimeDisplay =
            document.getElementById(
                "videoCurrentTimeDisplay"
            );

        const seekInput =
            document.getElementById(
                "videoSeekInput"
            );

        const seekButton =
            document.getElementById(
                "videoSeekButton"
            );

        const feedbackElement =
            document.getElementById(
                "videoSeekFeedback"
            );

        const clipSelectionDisplay =
            document.getElementById(
                "clipSelectionDisplay"
            );

        /*
         * ============================================================
         * FASE 3
         * Criação dos domínios
         *
         * Nesta fase todos os domínios do Media Workspace
         * são materializados.
         *
         * Nenhum domínio é inicializado nesta etapa.
         * ============================================================
         */

        const clipSelectionController =
            window.ClipSelectionController
                .createClipSelectionController(
                    window.ContentWorkspaceState
                );

        const clipOperationsController =
            window.ClipOperationsController
                .createClipOperationsController({

                    clipSelectionController

                });

        const clipOperationsApi =
            clipOperationsController
                .getApi();

        const mediaOperationsController =
            window.MediaOperationsController
                .createMediaOperationsController();

        const mediaOperationsApi =
            mediaOperationsController
                .getApi();

        /*
         * ============================================================
         * FASE 4
         * Inicialização dos domínios
         *
         * Nesta fase ocorre apenas a inicialização
         * dos componentes que possuem ciclo de vida.
         * ============================================================
         */

        window.TimelineWorkspace
            .initialize({

                videoElement

            });

        mediaOperationsController
            .initialize();

        /*
         * ============================================================
         * FASE 5
         * Integração entre domínios
         *
         * Este bloco representa o Composition Root
         * entre Timeline e Media Workspace.
         *
         * Toda integração futura da Timeline deverá
         * permanecer concentrada nesta região.
         * ============================================================
         */

        window.TimelineWorkspace
            .setSeekHandler({

                handler: requestedTime => {

                    videoElement.currentTime =
                        requestedTime;

                }

            });

        window.TimelineWorkspace
            .setSelectionStartHandler({

                handler: requestedTime => {

                    const selection =
                        clipSelectionController
                            .getSelection();

                    /*
                     * UF-02 — Timeline Selection Creation
                     *
                     * A Timeline produz apenas uma intenção
                     * temporal. O Composition Root decide
                     * qual operação deve ser executada
                     * conforme o estado atual da seleção.
                     */

                    if (
                        selection.startTime === null
                    ) {

                        clipSelectionController
                            .setClipStartTime(
                                requestedTime
                            );

                    } else if (
                        selection.endTime === null
                    ) {

                        /*
                         * A Timeline não deve construir
                         * uma seleção inválida.
                         *
                         * Caso o usuário selecione um
                         * tempo menor ou igual ao início,
                         * a operação é ignorada e a
                         * seleção permanece aguardando
                         * um fim válido.
                         */
                        if (
                            requestedTime <=
                            selection.startTime
                        ) {

                            return;

                        }

                        clipSelectionController
                            .setClipEndTime(
                                requestedTime
                            );

                    } else {

                        clipSelectionController
                            .clearSelection();

                        clipSelectionController
                            .setClipStartTime(
                                requestedTime
                            );

                    }

                    updateClipSelectionDisplay();

                }

            });

        /*
 * ============================================================
 * FASE 5.1
 * Funções privadas do Composition Root
 *
 * Estas funções pertencem exclusivamente ao
 * Media Workspace e são utilizadas pelas fases
 * subsequentes para sincronizar a interface com
 * o estado atual do domínio.
 * ============================================================
 */

        function handleSelectionValidation(
            validationResult,
            availableOperations
        ) {

            const operations =
                availableOperations.operations;

            markInButton.disabled =
                !operations.includes(
                    "DEFINE_SELECTION_START"
                );

            markOutButton.disabled =
                !operations.includes(
                    "DEFINE_SELECTION_END"
                );

            clearSelectionButton.disabled =
                !operations.includes(
                    window.ClipOperation.CLEAR_SELECTION
                );
        }

        function updateClipSelectionDisplay() {

            if (
                !clipSelectionDisplay
            ) {
                return;
            }

            const selection =
                clipSelectionController
                    .getSelection();

            const validationResult =
                mediaOperationsApi
                    .validateSelection(
                        selection
                    );

            const availableOperations =
                mediaOperationsApi
                    .resolveAvailableOperations(
                        selection
                    );

            handleSelectionValidation(
                validationResult,
                availableOperations
            );

            const startTime =
                formatVideoTime(
                    selection.startTime
                );

            const endTime =
                formatVideoTime(
                    selection.endTime
                );

            let duration =
                "--";

            if (
                selection.startTime !== null &&
                selection.endTime !== null
            ) {

                duration =
                    formatVideoTime(
                        Math.max(
                            0,
                            selection.endTime -
                            selection.startTime
                        )
                    );
            }

            const indicator =
                clipSelectionController
                    .hasSelection()
                    ? "☑"
                    : "☐";

            clipSelectionDisplay.innerText =
                `${indicator} Seleção Atual | Início: ${startTime} | Fim: ${endTime} | Duração: ${duration}`;
        }


        /*
         * ============================================================
         * FASE 6
         * Eventos do HTML5 Video
         *
         * Responsável pela sincronização entre o
         * HTML5 Video e os componentes do Media Workspace.
         * ============================================================
         */

        if (
            videoElement &&
            durationDisplay
        ) {

            videoElement.addEventListener(
                "loadedmetadata",
                () => {

                    const durationSeconds =
                        Math.floor(
                            videoElement.duration
                        );

                    const hours =
                        Math.floor(
                            durationSeconds / 3600
                        );

                    const minutes =
                        Math.floor(
                            (durationSeconds % 3600) / 60
                        );

                    const seconds =
                        durationSeconds % 60;

                    const formattedDuration =
                        [
                            hours,
                            minutes,
                            seconds
                        ]
                            .map(
                                value =>
                                    String(value)
                                        .padStart(
                                            2,
                                            "0"
                                        )
                            )
                            .join(":");

                    durationDisplay.innerText =
                        `Duração: ${formattedDuration}`;
                }
            );
        }

        if (
            videoElement &&
            currentTimeDisplay
        ) {

            videoElement.addEventListener(
                "timeupdate",

                () => {

                    const currentSeconds =
                        Math.floor(
                            videoElement.currentTime
                        );

                    const hours =
                        Math.floor(
                            currentSeconds / 3600
                        );

                    const minutes =
                        Math.floor(
                            (currentSeconds % 3600) / 60
                        );

                    const seconds =
                        currentSeconds % 60;

                    const formattedTime =
                        [
                            hours,
                            minutes,
                            seconds
                        ]
                            .map(
                                value =>
                                    String(value)
                                        .padStart(
                                            2,
                                            "0"
                                        )
                            )
                            .join(":");

                    currentTimeDisplay.innerText =
                        `Tempo Atual: ${formattedTime}`;

                    window.TimelineWorkspace
                        .updateCurrentTime({

                            currentTime:
                            videoElement.currentTime

                        });

                }
            );

        }

        /*
         * ============================================================
         * FASE 7
         * Eventos da Interface
         *
         * Responsável exclusivamente pela interação
         * do usuário com os componentes visuais.
         * ============================================================
         */

        if (
            videoElement &&
            seekInput &&
            seekButton
        ) {

            seekButton.addEventListener(
                "click",

                () => {

                    const targetTime =
                        parseTemporalInput(
                            seekInput.value
                        );

                    if (
                        Number.isNaN(
                            targetTime
                        )
                    ) {

                        if (feedbackElement) {

                            feedbackElement.innerText =
                                "Informe um tempo válido.";

                        }

                        return;
                    }

                    if (
                        targetTime < 0
                    ) {

                        if (feedbackElement) {

                            feedbackElement.innerText =
                                "O tempo não pode ser negativo.";

                        }

                        return;
                    }

                    if (
                        targetTime >
                        videoElement.duration
                    ) {

                        if (feedbackElement) {

                            feedbackElement.innerText =
                                `Tempo deve estar entre 0 e ${Math.floor(videoElement.duration)} segundos.`;

                        }

                        return;
                    }

                    if (feedbackElement) {

                        feedbackElement.innerText = "";

                    }

                    videoElement.currentTime =
                        targetTime;

                }
            );

        }

        if (
            videoElement &&
            markInButton
        ) {

            markInButton.addEventListener(
                "click",

                () => {

                    clipSelectionController
                        .setClipStartTime(
                            videoElement.currentTime
                        );

                    updateClipSelectionDisplay();

                }
            );

        }

        if (
            videoElement &&
            markOutButton
        ) {

            markOutButton.addEventListener(
                "click",

                () => {

                    clipSelectionController
                        .setClipEndTime(
                            videoElement.currentTime
                        );

                    updateClipSelectionDisplay();

                }
            );

        }

        if (
            clearSelectionButton
        ) {

            clearSelectionButton
                .addEventListener(

                    "click",

                    () => {

                        clipOperationsApi
                            .clearSelection();

                        updateClipSelectionDisplay();

                    }

                );

        }

        /*
         * ============================================================
         * FASE 8
         * Estado inicial
         *
         * Responsável por sincronizar a interface
         * com o estado inicial do Workspace.
         * ============================================================
         */

        updateClipSelectionDisplay();

    }

    loadJob();

</script>

</body>
</html>
