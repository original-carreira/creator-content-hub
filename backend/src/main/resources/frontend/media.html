<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Media Center</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">

    <h2>Media Center</h2>

    <div
       style="
            margin-bottom:20px;
            color:#666;
       "
    >
       Gerenciamento e Operações de Mídia
    </div>

    <div id="mediaContent">
        Carregando...
    </div>

</div>

<script src="content-workspace/state/workspaceState.js"></script>
<script src="content-workspace/renderers/videoWorkspaceRenderer.js"></script>
<script src="content-workspace/clip/clipSelectionController.js"></script>
<script src="content-workspace/selection-collection/selectionCollectionController.js"></script>
<script src="content-workspace/selection-workspace/selectionWorkspace.js"></script>
<script src="content-workspace/selection-editing/selectionEditingController.js"></script>
<script src="content-workspace/clip/clipOperation.js"></script>
<script src="content-workspace/clip/operationResult.js"></script>
<script src="content-workspace/clip/clipOperationsController.js"></script>
<script src="content-workspace/media-operations/mediaOperationsController.js"></script>
<script src="content-workspace/timeline/timelineRenderer.js"></script>
<script src="content-workspace/timeline/timelineController.js"></script>
<script src="content-workspace/timeline/timelineView.js"></script>
<script src="content-workspace/timeline/timelineWorkspace.js"></script>

<script>

    function getJobId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get("jobId");
    }

    function parseTemporalInput(
        value
    ) {

        const normalizedValue =
            value.trim();

        if (
            normalizedValue === ""
        ) {
            return Number.NaN;
        }

        if (
            /^\d+$/.test(
                normalizedValue
            )
        ) {

            return Number(
                normalizedValue
            );
        }

        const parts =
            normalizedValue.split(
                ":"
            );

        if (
            parts.length !== 2 &&
            parts.length !== 3
        ) {
            return Number.NaN;
        }

        const numericParts =
            parts.map(
                part => Number(part)
            );

        if (
            numericParts.some(
                Number.isNaN
            )
        ) {
            return Number.NaN;
        }

        if (
            parts.length === 2
        ) {

            const [
                minutes,
                seconds
            ] = numericParts;

            return (
                minutes * 60 +
                seconds
            );
        }

        const [
            hours,
            minutes,
            seconds
        ] = numericParts;

        return (
            hours * 3600 +
            minutes * 60 +
            seconds
        );
    }

    function formatVideoTime(
        totalSeconds
    ) {

        if (
            totalSeconds === null ||
            Number.isNaN(totalSeconds)
        ) {
            return "--";
        }

        const seconds =
            Math.floor(totalSeconds);

        const hours =
            Math.floor(
                seconds / 3600
            );

        const minutes =
            Math.floor(
                (seconds % 3600) / 60
            );

        const remainingSeconds =
            seconds % 60;

        return [
            hours,
            minutes,
            remainingSeconds
        ]
            .map(
                value =>
                    String(value)
                        .padStart(
                            2,
                            "0"
                        )
            )
            .join(":");
    }

    async function loadJob() {

        const jobId =
            getJobId();

        if (!jobId) {

            document.getElementById(
                "mediaContent"
            ).innerText =
                "Job inválido";

            return;
        }

        try {

            const response =
                await fetch(
                    `/jobs/${jobId}/assets`
                );

            const payload =
                await response.json();

            const assets =
                payload.data;

            renderMediaCenter(
                assets
            );

        } catch (error) {

            console.error(
                "[MEDIA CENTER LOAD ERROR]",
                error
            );

            document.getElementById(
                "mediaContent"
            ).innerText =
                "Erro ao carregar Media Center";
        }
    }

    function renderMediaCenter(
        assets
    ) {

        /*
         * ============================================================
         * FASE 1
         * Renderização do Media Workspace
         * ============================================================
         */

        document.getElementById(
            "mediaContent"
        ).innerHTML =
            window.VideoWorkspaceRenderer
                .renderVideoWorkspace(
                    assets
                );

        /*
         * ============================================================
         * FASE 2
         * Resolução das referências do DOM
         *
         * Nesta fase nenhum comportamento é executado.
         * Apenas são resolvidas todas as referências
         * necessárias para as fases seguintes.
         * ============================================================
         */

        const videoElement =
            document.querySelector(
                "video"
            );

        const markInButton =
            document.getElementById(
                "clipMarkInButton"
            );

        const markOutButton =
            document.getElementById(
                "clipMarkOutButton"
            );

        const clearSelectionButton =
            document.getElementById(
                "clipClearSelectionButton"
            );

        const saveSelectionButton =
            document.getElementById(
                "clipSaveSelectionButton"
            );

        const durationDisplay =
            document.getElementById(
                "videoDurationDisplay"
            );

        const currentTimeDisplay =
            document.getElementById(
                "videoCurrentTimeDisplay"
            );

        const seekInput =
            document.getElementById(
                "videoSeekInput"
            );

        const seekButton =
            document.getElementById(
                "videoSeekButton"
            );

        const feedbackElement =
            document.getElementById(
                "videoSeekFeedback"
            );

        const clipSelectionDisplay =
            document.getElementById(
                "clipSelectionDisplay"
            );

        const materializedSelectionsList =
            document.getElementById(
                "materializedSelectionsList"
            );

        const clearAllMaterializedSelectionsButton =
            document.getElementById(
                "clearAllMaterializedSelectionsButton"
            );

        const materializedSelectionExportFeedback =
            document.getElementById(
                "materializedSelectionExportFeedback"
            );

        const videoAsset =
            assets?.find(
                asset =>
                    asset.assetType === "VIDEO"
            );

        /*
         * ============================================================
         * FASE 3
         * Criação dos domínios
         *
         * Nesta fase todos os domínios do Media Workspace são materializados.
         *
         * Cada domínio permanece isolado durante esta etapa.
         *
         * Nenhum domínio é inicializado.
         * Nenhuma integração entre domínios ocorre nesta fase.
         * A integração permanece concentrada exclusivamente no Composition Root
         * durante as fases subsequentes.
         * ============================================================
         */

        const clipSelectionController =
            window.ClipSelectionController
                .createClipSelectionController(
                    window.ContentWorkspaceState
                );

        const selectionCollectionController =
            window.SelectionCollectionController
                .createSelectionCollectionController({

                    onChange:
                        updateMaterializedSelectionsDisplay

                });

        const selectionWorkspace =
            window.SelectionWorkspace
                .createSelectionWorkspace({

                    clipSelectionController,

                    selectionCollectionController

                });

        const selectionEditingController =
            window.SelectionEditingController
                .createSelectionEditingController({

                    clipSelectionController,

                    selectionWorkspace

                });

        const clipOperationsController =
            window.ClipOperationsController
                .createClipOperationsController({

                    clipSelectionController

                });

        const clipOperationsApi =
            clipOperationsController
                .getApi();

        const mediaOperationsController =
            window.MediaOperationsController
                .createMediaOperationsController();

        const mediaOperationsApi =
            mediaOperationsController
                .getApi();

        /*
         * ============================================================
         * FASE 4
         * Inicialização dos domínios
         *
         * Nesta fase ocorre apenas a inicialização
         * dos componentes que possuem ciclo de vida.
         * ============================================================
         */

        window.TimelineWorkspace
            .initialize({

                videoElement

            });

        mediaOperationsController
            .initialize();

        /*
         * ============================================================
         * FASE 5
         * Integração entre domínios
         *
         * Este bloco representa o Composition Root
         * entre Timeline e Media Workspace.
         *
         * Toda integração futura da Timeline deverá
         * permanecer concentrada nesta região.
         * ============================================================
         */

        window.TimelineWorkspace
            .setSeekHandler({

                handler: requestedTime => {

                    videoElement.currentTime =
                        requestedTime;

                }

            });

        /*
         * ============================================================
         * Selection Editing
         *
         * Contrato de integração entre Timeline
         * e Selection Editing.
         *
         * Nesta etapa apenas o ponto de integração
         * é materializado.
         *
         * Nenhuma comunicação entre os domínios
         * ocorre durante esta Foundation.
         * ============================================================
         */

        window.TimelineWorkspace
            .setTimelineInteractionHandler({

                handler: timelineInteraction => {

                    selectionEditingController
                        .handleTimelineInteraction(
                            timelineInteraction
                        );

                    /* S-02
                     * O Composition Root permanece responsável por sincronizar
                     * a representação visual com o estado atualizado do domínio.
                     */
                    updateTimelineSelections();

                    updateClipSelectionDisplay();

                }

            });

        window.TimelineWorkspace
            .setHandleInteractionHandler({

                handler: handleInteraction => {

                    selectionEditingController
                        .handleHandleInteraction(
                            handleInteraction
                        );

                }

            });

        window.TimelineWorkspace
            .setHandleMoveInteractionHandler({

                handler: handleMoveInteraction => {

                    selectionEditingController
                        .handleHandleMoveInteraction(
                            handleMoveInteraction
                        );

                    updateTimelineSelections();

                    updateClipSelectionDisplay();

                }

            });

        window.TimelineWorkspace
            .setHandleReleaseInteractionHandler({

                handler: handleReleaseInteraction => {

                    selectionEditingController
                        .handleHandleReleaseInteraction(
                            handleReleaseInteraction
                        );

                }

            });

        window.TimelineWorkspace
            .setSelectionMoveInteractionHandler({

                handler: selectionMoveInteraction => {

                    selectionEditingController
                        .handleSelectionMoveInteraction(
                            selectionMoveInteraction
                        );

                }

            });

        window.TimelineWorkspace
            .setSelectionMoveUpdateInteractionHandler({

                handler: selectionMoveUpdateInteraction => {

                    selectionEditingController
                        .handleSelectionMoveUpdateInteraction(
                            selectionMoveUpdateInteraction
                        );

                    updateTimelineSelections();

                    updateClipSelectionDisplay();

                }

            });

        window.TimelineWorkspace
            .setSelectionMoveReleaseInteractionHandler({

                handler:
                    selectionMoveReleaseInteraction => {

                    selectionEditingController
                        .handleSelectionMoveReleaseInteraction(
                            selectionMoveReleaseInteraction
                        );

                    }

            });

        /*
         * ============================================================
         * FASE 5.1
         * Funções privadas do Composition Root
         *
         * Estas funções pertencem exclusivamente ao
         * Media Workspace e são utilizadas pelas fases
         * subsequentes para sincronizar a interface com
         * o estado atual do domínio.
         * ============================================================
         */

        function updateTimelineSelections() {

            const materializedSelections =
                selectionWorkspace
                    .getSelectionCollection()
                    .getSelections();

            const currentSelection =
                selectionWorkspace
                    .getSelection();

            const selections = [
                ...materializedSelections
            ];

            if (
                currentSelection.startTime !== null &&
                currentSelection.endTime !== null
            ) {

                const alreadyMaterialized =
                    selectionWorkspace
                        .getSelectionCollection()
                        .containsSelectionSource(
                            currentSelection
                        );

                if (
                    !alreadyMaterialized
                ) {

                    selections.push(
                        currentSelection
                    );

                }

            }

            timelineController
                ?.updateSelections({

                    selections

                });
        }


        function handleSelectionValidation(
            validationResult,
            availableOperations,
            selection
        ) {

            const operations =
                availableOperations.operations;

            markInButton.disabled =
                !operations.includes(
                    "DEFINE_SELECTION_START"
                );

            markOutButton.disabled =
                !operations.includes(
                    "DEFINE_SELECTION_END"
                );

            clearSelectionButton.disabled =
                !operations.includes(
                    window.ClipOperation.CLEAR_SELECTION
                );

            saveSelectionButton.disabled =
                !(
                    validationResult.isValid &&
                    selection.endTime !== null
                );
        }

        function updateClipSelectionDisplay() {

            if (
                !clipSelectionDisplay
            ) {
                return;
            }

            /*
             * S-03
             * A atualização da representação da Selection no Media Workspace
             * permanece sob responsabilidade do Composition Root.
             *
             * Esta leitura direta do estado da Selection não é migrada para
             * SelectionWorkspace porque pertence à sincronização específica
             * da UI e à integração com Media Operations.
             */

            const selection =
                clipSelectionController
                    .getSelection();

            const validationResult =
                mediaOperationsApi
                    .validateSelection(
                        selection
                    );

            const availableOperations =
                mediaOperationsApi
                    .resolveAvailableOperations(
                        selection
                    );

            handleSelectionValidation(
                validationResult,
                availableOperations,
                selection
            );

            const startTime =
                formatVideoTime(
                    selection.startTime
                );

            const endTime =
                formatVideoTime(
                    selection.endTime
                );

            let duration =
                "--";

            if (
                selection.startTime !== null &&
                selection.endTime !== null
            ) {

                duration =
                    formatVideoTime(
                        Math.max(
                            0,
                            selection.endTime -
                            selection.startTime
                        )
                    );
            }

            const indicator =
                clipSelectionController
                    .hasActiveSelection()
                    ? "☑"
                    : "☐";

            let selectionLabel =
                "Nenhuma seleção";

            if (
                selection.startTime !== null &&
                selection.endTime === null
            ) {

                selectionLabel =
                    "Seleção em andamento";

            }
            else if (

                selection.startTime !== null &&

                selection.endTime !== null

            ) {

                selectionLabel =
                    "Seleção Atual";

            }

            clipSelectionDisplay.innerText =
                `${indicator} ${selectionLabel} | Início: ${startTime} | Fim: ${endTime} | Duração: ${duration}`;
        }

        function updateMaterializedSelectionsDisplay() {

            if (
                !materializedSelectionsList ||
                !selectionWorkspace
            ) {
                return;
            }

            const selections =
                selectionWorkspace
                    .getSelectionCollection()
                    .getSelections();

            if (
                clearAllMaterializedSelectionsButton
            ) {
                clearAllMaterializedSelectionsButton
                    .disabled =
                    selections.length === 0;
            }

            materializedSelectionsList
                .replaceChildren();

            if (selections.length === 0) {

                const emptyRow =
                    document.createElement("div");

                emptyRow.setAttribute("role", "row");
                emptyRow.style.padding = "8px 0";
                emptyRow.style.color = "#666";
                emptyRow.style.fontSize = "13px";

                const emptyCell =
                    document.createElement("span");

                emptyCell.setAttribute("role", "cell");
                emptyCell.style.gridColumn = "1 / -1";
                emptyCell.textContent =
                    "Nenhuma Selection materializada.";

                emptyRow.appendChild(emptyCell);
                materializedSelectionsList
                    .appendChild(emptyRow);

                return;

            }

            selections.forEach(selection => {

                const row =
                    document.createElement("div");

                row.setAttribute("role", "row");
                row.dataset.selectionId =
                    String(selection.id);
                row.style.display = "grid";
                row.style.gridTemplateColumns =
                    "1.4fr 1fr 1fr 1fr auto";
                row.style.gap = "8px";
                row.style.padding = "8px 0";
                row.style.borderBottom =
                    "1px solid #eee";
                row.style.fontSize = "13px";

                const duration =
                    selection.endTime -
                    selection.startTime;

                [
                    selection.id,
                    formatVideoTime(selection.startTime),
                    formatVideoTime(selection.endTime),
                    formatVideoTime(duration)
                ].forEach(value => {

                    const cell =
                        document.createElement("span");

                    cell.setAttribute("role", "cell");
                    cell.textContent = String(value);
                    row.appendChild(cell);

                });

                const actionCell =
                    document.createElement("span");

                actionCell.setAttribute("role", "cell");

                const exportButton =
                    document.createElement("button");

                exportButton.type = "button";
                exportButton.textContent = "Exportar";
                exportButton.dataset.selectionId =
                    String(selection.id);
                exportButton.disabled =
                    !videoAsset;
                exportButton.addEventListener(
                    "click",
                    () => exportMaterializedSelection(
                        selection.id,
                        exportButton
                    )
                );

                actionCell.appendChild(exportButton);

                const removeButton =
                    document.createElement("button");

                removeButton.type = "button";
                removeButton.textContent = "Remover";
                removeButton.dataset.selectionId =
                    String(selection.id);
                removeButton.style.marginLeft = "6px";
                removeButton.addEventListener(
                    "click",
                    () => removeMaterializedSelection(
                        selection.id
                    )
                );

                actionCell.appendChild(removeButton);
                row.appendChild(actionCell);

                materializedSelectionsList
                    .appendChild(row);

            });

        }

        function removeMaterializedSelection(
            selectionId
        ) {

            const removed =
                selectionWorkspace
                    .removeMaterializedSelection(
                        selectionId
                    );

            if (removed) {
                updateTimelineSelections();
            }

            return removed;

        }

        function removeAllMaterializedSelections() {

            if (
                !window.confirm(
                    "Remover todas as Selections materializadas?"
                )
            ) {
                return false;
            }

            const removed =
                selectionWorkspace
                    .removeAllMaterializedSelections();

            if (removed) {
                updateTimelineSelections();
            }

            return removed;

        }

        async function exportMaterializedSelection(
            selectionId,
            button
        ) {

            const selection =
                selectionWorkspace
                    .getMaterializedSelection(
                        selectionId
                    );

            const jobId = getJobId();

            if (
                !selection ||
                !videoAsset ||
                !jobId
            ) {
                if (materializedSelectionExportFeedback) {
                    materializedSelectionExportFeedback.innerText =
                        "Não foi possível resolver a seleção ou o vídeo para exportação.";
                    materializedSelectionExportFeedback.style.color =
                        "#b00020";
                }
                return;
            }

            const originalButtonText =
                button.textContent;

            button.disabled = true;
            button.textContent = "Exportando…";

            if (materializedSelectionExportFeedback) {
                materializedSelectionExportFeedback.innerText =
                    `Exportando ${selectionId}…`;
                materializedSelectionExportFeedback.style.color =
                    "#444";
            }

            try {
                const response = await fetch(
                    `/jobs/${encodeURIComponent(jobId)}` +
                    `/assets/${encodeURIComponent(videoAsset.assetId)}` +
                    "/selections/export",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            selectionId: String(selectionId),
                            startTime: selection.startTime,
                            endTime: selection.endTime
                        })
                    }
                );

                if (!response.ok) {
                    let message =
                        `Falha na exportação (${response.status}).`;

                    try {
                        const payload =
                            await response.json();

                        message =
                            payload.error?.message ||
                            message;
                    } catch (_error) {
                        // Retain the status-based message for non-JSON errors.
                    }

                    throw new Error(message);
                }

                const blob = await response.blob();
                const objectUrl =
                    URL.createObjectURL(blob);

                const contentDisposition =
                    response.headers.get(
                        "Content-Disposition"
                    ) || "";

                const filenameMatch =
                    contentDisposition.match(
                        /filename\s*=\s*(?:"([^"]+)"|([^;]+))/i
                    );

                const downloadLink =
                    document.createElement("a");

                downloadLink.href = objectUrl;
                downloadLink.download =
                    (filenameMatch?.[1] || filenameMatch?.[2])
                        ?.trim() ||
                    `${selectionId}.mp4`;
                downloadLink.style.display = "none";
                document.body.appendChild(downloadLink);
                downloadLink.click();
                downloadLink.remove();

                window.setTimeout(
                    () => URL.revokeObjectURL(objectUrl),
                    1000
                );

                if (materializedSelectionExportFeedback) {
                    materializedSelectionExportFeedback.innerText =
                        `Exportação de ${selectionId} concluída.`;
                    materializedSelectionExportFeedback.style.color =
                        "#246b35";
                }

            } catch (error) {
                console.warn(
                    "[SELECTION EXPORT FAILED]",
                    error
                );

                if (materializedSelectionExportFeedback) {
                    materializedSelectionExportFeedback.innerText =
                        error.message ||
                        "Não foi possível exportar a seleção.";
                    materializedSelectionExportFeedback.style.color =
                        "#b00020";
                }

            } finally {
                button.disabled = !videoAsset;
                button.textContent = originalButtonText;
            }

        }


        /*
         * ============================================================
         * FASE 6
         * Eventos do HTML5 Video
         *
         * Responsável pela sincronização entre o
         * HTML5 Video e os componentes do Media Workspace.
         * ============================================================
         */

        if (
            videoElement &&
            durationDisplay
        ) {

            videoElement.addEventListener(
                "loadedmetadata",
                () => {

                    const durationSeconds =
                        Math.floor(
                            videoElement.duration
                        );

                    const hours =
                        Math.floor(
                            durationSeconds / 3600
                        );

                    const minutes =
                        Math.floor(
                            (durationSeconds % 3600) / 60
                        );

                    const seconds =
                        durationSeconds % 60;

                    const formattedDuration =
                        [
                            hours,
                            minutes,
                            seconds
                        ]
                            .map(
                                value =>
                                    String(value)
                                        .padStart(
                                            2,
                                            "0"
                                        )
                            )
                            .join(":");

                    durationDisplay.innerText =
                        `Duração: ${formattedDuration}`;
                }
            );
        }

        if (
            videoElement &&
            currentTimeDisplay
        ) {

            videoElement.addEventListener(
                "timeupdate",

                () => {

                    const currentSeconds =
                        Math.floor(
                            videoElement.currentTime
                        );

                    const hours =
                        Math.floor(
                            currentSeconds / 3600
                        );

                    const minutes =
                        Math.floor(
                            (currentSeconds % 3600) / 60
                        );

                    const seconds =
                        currentSeconds % 60;

                    const formattedTime =
                        [
                            hours,
                            minutes,
                            seconds
                        ]
                            .map(
                                value =>
                                    String(value)
                                        .padStart(
                                            2,
                                            "0"
                                        )
                            )
                            .join(":");

                    currentTimeDisplay.innerText =
                        `Tempo Atual: ${formattedTime}`;

                    window.TimelineWorkspace
                        .updateCurrentTime({

                            currentTime:
                            videoElement.currentTime

                        });

                }
            );

        }

        /*
         * ============================================================
         * FASE 7
         * Eventos da Interface
         *
         * Responsável exclusivamente pela interação
         * do usuário com os componentes visuais.
         * ============================================================
         */

        if (
            videoElement &&
            seekInput &&
            seekButton
        ) {

            seekButton.addEventListener(
                "click",

                () => {

                    const targetTime =
                        parseTemporalInput(
                            seekInput.value
                        );

                    if (
                        Number.isNaN(
                            targetTime
                        )
                    ) {

                        if (feedbackElement) {

                            feedbackElement.innerText =
                                "Informe um tempo válido.";

                        }

                        return;
                    }

                    if (
                        targetTime < 0
                    ) {

                        if (feedbackElement) {

                            feedbackElement.innerText =
                                "O tempo não pode ser negativo.";

                        }

                        return;
                    }

                    if (
                        targetTime >
                        videoElement.duration
                    ) {

                        if (feedbackElement) {

                            feedbackElement.innerText =
                                `Tempo deve estar entre 0 e ${Math.floor(videoElement.duration)} segundos.`;

                        }

                        return;
                    }

                    if (feedbackElement) {

                        feedbackElement.innerText = "";

                    }

                    videoElement.currentTime =
                        targetTime;

                }
            );

        }

        if (
            videoElement &&
            markInButton
        ) {

            markInButton.addEventListener(
                "click",

                () => {

                    clipSelectionController
                        .setClipStartTime(
                            videoElement.currentTime
                        );

                    updateTimelineSelections();

                    updateClipSelectionDisplay();

                }
            );

        }

        if (
            videoElement &&
            markOutButton
        ) {

            markOutButton.addEventListener(
                "click",

                () => {

                    clipSelectionController
                        .setClipEndTime(
                            videoElement.currentTime
                        );

                    updateTimelineSelections();

                    updateClipSelectionDisplay();

                }
            );

        }

        if (
            clearSelectionButton
        ) {

            clearSelectionButton
                .addEventListener(

                    "click",

                    () => {

                        clipOperationsApi
                            .clearSelection();

                        updateTimelineSelections();

                        updateClipSelectionDisplay();

                    }

                );

        }

        if (
            saveSelectionButton
        ) {

            saveSelectionButton
                .addEventListener(

                    "click",

                    () => {

                        const materialized =
                            selectionWorkspace
                                .materializeSelection();

                        if (
                            materialized
                        ) {

                            updateTimelineSelections();

                            updateClipSelectionDisplay();

                        }

                    }

                );

        }

        if (
            clearAllMaterializedSelectionsButton
        ) {

            clearAllMaterializedSelectionsButton
                .addEventListener(
                    "click",
                    removeAllMaterializedSelections
                );

        }

        /*
         * ============================================================
