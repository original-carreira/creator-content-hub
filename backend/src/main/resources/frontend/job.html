<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Detalhe do Job</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
    <h2>Detalhes do Conteúdo</h2>

    <div id="jobContent">Carregando...</div>
</div>

<script src="content-workspace/state/workspaceState.js"></script>

<script src="content-workspace/assets/assetActionFactory.js"></script>

<script src="content-workspace/assets/assetActionController.js"></script>

<script src="content-workspace/assets/assetCollectionFactory.js"></script>

<script src="content-workspace/renderers/transcriptRenderer.js"></script>

<script src="content-workspace/renderers/workspaceHeaderRenderer.js"></script>

<script src="content-workspace/renderers/videoWorkspaceRenderer.js"></script>

<script src="content-workspace/renderers/audioWorkspaceRenderer.js"></script>

<script src="content-workspace/renderers/workspaceToolbarRenderer.js"></script>

<script src="content-workspace/search/transcriptSearchController.js"></script>

<script src="content-workspace/export/workspaceExportController.js"></script>

<script>

    const workspaceStateApi =
        window.ContentWorkspaceState;

    function getJobId() {
        const params = new URLSearchParams(window.location.search);
        return params.get("jobId");
    }

    async function loadJob() {
        const jobId = getJobId();

        if (!jobId) {
            document.getElementById("jobContent").innerText = "Job inválido";
            return;
        }

        try {
            const jobResponse = await fetch(`/jobs/${jobId}`);

            const jobData =  await jobResponse.json();

            const job = jobData.data;

            const transcript = await loadTranscript(jobId);

            workspaceStateApi.setTranscript(
                transcript.data
            );

            renderJob(job);

        } catch (err) {

            console.error(
                "[CONTENT WORKSPACE LOAD ERROR]",
                err
            );

            document.getElementById("jobContent").innerText =
                "Erro ao carregar conteúdo";
        }
    }

    async function loadTranscript(jobId) {

        const res =
            await fetch(`/jobs/${jobId}/transcript`);

        return await res.json();
    }

    function renderSummaryWorkspace() {

        return `
        <div class="detail-block">

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    margin-bottom:10px;
                "
            >
                <strong>Resumo Gerado</strong>

                <span
                    style="
                        font-size:12px;
                        color:#666;
                    "
                >
                    Síntese do Conteúdo
                </span>
            </div>

            <div
                style="
                    border:1px solid #ddd;
                    border-radius:10px;
                    background:#fafafa;
                    padding:16px;
                "
            >
                <pre
                    id="summary"
                    style="
                        margin:0;
                        white-space:pre-wrap;
                        word-break:break-word;
                        line-height:1.6;
                        font-size:14px;
                        font-family:inherit;
                    "
                ></pre>
            </div>
        </div>
    `;
    }

    function renderJob(job) {

        workspaceStateApi.setWorkspaceJobId(
            getJobId()
        );

        const assetCollection =
            window.AssetCollectionFactory
                .buildAssetCollection(job);

        workspaceStateApi.setAssetCollection(
            assetCollection
        );

        const container = document.getElementById("jobContent");

        container.innerHTML = `
            ${window.WorkspaceHeaderRenderer.renderJobHeader(job)}

            ${window.AudioWorkspaceRenderer.renderAudioWorkspace(
            workspaceStateApi.workspaceState.assetCollection
        )}

            ${window.WorkspaceToolbarRenderer.renderWorkspaceToolbar()}

            ${window.TranscriptRenderer.renderTranscriptWorkspace()}

                ${renderSummaryWorkspace()}
        `;

        window.TranscriptRenderer
            .renderTranscriptSegments(

                workspaceStateApi
                    .workspaceState
                    .transcript
                    ?.segments || []
            );

        window.TranscriptSearchController
            .bindTranscriptSearch(
                workspaceStateApi
            );

        window.TranscriptRenderer
            .bindRangeActions();

        window.TranscriptRenderer
            .bindClearRangesAction();

        window.WorkspaceExportController
            .bindWorkspaceExports(
                workspaceStateApi
            );

        window.AssetActionController
            .bindAssetActions(
                workspaceStateApi
            );

        const mediaButton =
            document.getElementById(
                "workspaceMediaButton"
            );

        if (mediaButton) {

            mediaButton.addEventListener(
                "click",
                () => {

                    window.open(
                        `/media.html?jobId=${getJobId()}`,
                        "_blank"
                    );
                }
            );
        }

        document.getElementById("summary").innerText =
            job.summary || "(vazio)";
    }

    loadJob();
</script>

</body>
</html>
